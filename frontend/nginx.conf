server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container.
    # The trailing "/" in proxy_pass strips the /api prefix:
    #   /api/students  ->  http://backend:8000/students
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router handles URLs like /students/3 in the browser,
    # so any unknown path returns index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
